    nombre: Laboratorio 6 - Naive Bayes and Decision Trees
    tarea: 947252
    carpeta: ../lab6
    momento: due
    realidad: Nunca se entregó y no hay carpeta local.
    esperado:
      hechos: {folder: problem, submission: warning}
      sin_cumple: true

