# Casos reales para probar el pre-flight. Las expectativas se escribieron ANTES de correr
# la auditoría, a partir de lo que pasó de verdad con cada tarea (y no de lo que salió).
# Las notas reales no se publican aquí; van solo en el informe.
#
# esperado:
#   hechos: estado esperado de una revisión del script (check: estado).
#   sin_cumple: ningún criterio puede quedar en "cumple" (no se entregó nada).
#   sin_falta: ningún criterio puede quedar en "falta" (entrega completa; todo faltante es inventado).
#   detecta: hallazgos que el agente debe hacer: un criterio en parcial o falta que cite una
#            de esas líneas y mencione alguna de esas palabras.
#   fechas: líneas que deben aparecer entre las fechas encontradas.

curso: ~/Downloads/preflight_46981_assignments.json

casos:
